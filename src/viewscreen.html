<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the-bridge · viewscreen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0e17;
      --surface: #111827;
      --surface-hover: #1a2235;
      --border: #1e293b;
      --border-glow: #334155;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #475569;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.1);
      --green: #34d399;
      --green-dim: rgba(52, 211, 153, 0.1);
      --amber: #fbbf24;
      --amber-dim: rgba(251, 191, 36, 0.1);
      --red: #f87171;
      --red-dim: rgba(248, 113, 113, 0.1);
      --purple: #a78bfa;
      --purple-dim: rgba(167, 139, 250, 0.1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Star field background ─────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.15), transparent),
        radial-gradient(1px 1px at 30% 65%, rgba(255,255,255,0.1), transparent),
        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.12), transparent),
        radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.08), transparent),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.1), transparent),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.06), transparent),
        radial-gradient(1px 1px at 45% 50%, rgba(255,255,255,0.1), transparent),
        radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.08), transparent),
        radial-gradient(1.5px 1.5px at 25% 35%, rgba(56,189,248,0.15), transparent),
        radial-gradient(1.5px 1.5px at 65% 75%, rgba(167,139,250,0.12), transparent),
        radial-gradient(1.5px 1.5px at 85% 55%, rgba(52,211,153,0.1), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ────────────────────────────────────────── */
    .viewscreen {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* ── Header ────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header .tagline {
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
    }

    /* ── Status bar ────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 12px 0;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }

    .status-bar .indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
      animation: pulse 3s ease-in-out infinite;
    }

    .status-bar .dot.disconnected {
      background: var(--red);
      box-shadow: 0 0 8px rgba(248, 113, 113, 0.5);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Sections ──────────────────────────────────────── */
    .section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .section-header .count {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }

    /* ── Agent cards ───────────────────────────────────── */
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      transition: all 0.2s ease;
      animation: cardIn 0.3s ease-out;
    }

    .agent-card:hover {
      border-color: var(--border-glow);
      background: var(--surface-hover);
    }

    .agent-card.departing {
      animation: cardOut 0.4s ease-in forwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }

    .agent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .agent-name {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .agent-protocol {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .protocol-mcp {
      color: var(--accent);
      background: var(--accent-dim);
    }

    .protocol-ui {
      color: var(--amber);
      background: var(--amber-dim);
    }

    .protocol-a2a {
      color: var(--purple);
      background: var(--purple-dim);
    }

    .protocol-custom {
      color: var(--text-muted);
      background: rgba(100, 116, 139, 0.1);
    }

    .agent-capabilities {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .capability {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      background: rgba(100, 116, 139, 0.08);
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid rgba(100, 116, 139, 0.1);
    }

    .agent-meta {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Activity log ──────────────────────────────────── */
    .log {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.8;
      color: var(--text-muted);
      max-height: 280px;
      overflow-y: auto;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .log::-webkit-scrollbar {
      width: 4px;
    }

    .log::-webkit-scrollbar-thumb {
      background: var(--border-glow);
      border-radius: 2px;
    }

    .log-entry {
      animation: logIn 0.2s ease-out;
    }

    @keyframes logIn {
      from { opacity: 0; transform: translateX(-4px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .log-time {
      color: var(--text-dim);
      margin-right: 8px;
    }

    .log-event-join { color: var(--green); }
    .log-event-depart { color: var(--red); }
    .log-event-message { color: var(--accent); }
    .log-event-system { color: var(--text-dim); }

    /* ── Empty state ───────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .empty-state .empty-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-state p {
      max-width: 360px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Messages section ──────────────────────────────── */
    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .message-route {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
    }

    .message-arrow {
      color: var(--text-dim);
    }

    .message-instruction {
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .message-status {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .status-pending { color: var(--amber); background: var(--amber-dim); }
    .status-delivered { color: var(--accent); background: var(--accent-dim); }
    .status-completed { color: var(--green); background: var(--green-dim); }
    .status-failed, .status-expired { color: var(--red); background: var(--red-dim); }

    .message-time {
      color: var(--text-dim);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="viewscreen">
    <!-- Header -->
    <div class="header">
      <h1>the-bridge</h1>
      <span class="tagline">"Number One, you have the bridge."</span>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <div class="indicator">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">connecting...</span>
      </div>
      <span id="uptime">—</span>
      <span id="agent-count">0 agents</span>
    </div>

    <!-- Agents on the bridge -->
    <div class="section">
      <div class="section-header">
        <h2>On the Bridge</h2>
        <span class="count" id="present-count"></span>
      </div>
      <div class="agents-grid" id="agents-grid">
        <div class="empty-state">
          <div class="empty-icon">◇</div>
          <p>No agents on the bridge. Agents arrive when they announce themselves — through MCP, or through the fallback protocol.</p>
        </div>
      </div>
    </div>

    <!-- Messages in flight -->
    <div class="section">
      <div class="section-header">
        <h2>Messages</h2>
        <span class="count" id="message-count"></span>
      </div>
      <div class="messages-list" id="messages-list">
      </div>
    </div>

    <!-- Activity log -->
    <div class="section">
      <div class="section-header">
        <h2>Log</h2>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const DAEMON_URL = window.location.origin;
    const logEl = document.getElementById('log');
    const agentsGrid = document.getElementById('agents-grid');
    const messagesList = document.getElementById('messages-list');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const uptimeEl = document.getElementById('uptime');
    const agentCountEl = document.getElementById('agent-count');
    const presentCountEl = document.getElementById('present-count');
    const messageCountEl = document.getElementById('message-count');

    let agents = [];
    let eventSource = null;

    // ── Logging ────────────────────────────────────────
    function log(message, type = 'system') {
      const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-time">${time}</span><span class="log-event-${type}">${message}</span>`;
      logEl.prepend(entry);

      // Keep log manageable
      while (logEl.children.length > 100) {
        logEl.removeChild(logEl.lastChild);
      }
    }

    // ── Time formatting ────────────────────────────────
    function relativeTime(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const secs = Math.floor(diff / 1000);
      if (secs < 60) return `${secs}s ago`;
      const mins = Math.floor(secs / 60);
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      return `${hrs}h ago`;
    }

    function formatUptime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return `uptime ${h}h ${m}m`;
      if (m > 0) return `uptime ${m}m ${s}s`;
      return `uptime ${s}s`;
    }

    // ── Render agents ──────────────────────────────────
    function renderAgents() {
      if (agents.length === 0) {
        agentsGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">◇</div>
            <p>No agents on the bridge. Agents arrive when they announce themselves — through MCP, or through the fallback protocol.</p>
          </div>`;
        presentCountEl.textContent = '';
        return;
      }

      presentCountEl.textContent = `${agents.length}`;
      agentsGrid.innerHTML = agents.map(agent => `
        <div class="agent-card" data-id="${agent.id}">
          <div class="agent-header">
            <span class="agent-name">${agent.name}</span>
            <span class="agent-protocol protocol-${agent.protocol}">${agent.protocol}</span>
          </div>
          <div class="agent-capabilities">
            ${(agent.capabilities || []).map(c => `<span class="capability">${c}</span>`).join('')}
          </div>
          <div class="agent-meta">
            <span>seen ${relativeTime(agent.last_seen)}</span>
            <span>joined ${relativeTime(agent.announced_at)}</span>
          </div>
        </div>
      `).join('');
    }

    // ── Render messages ────────────────────────────────
    function renderMessages(messages) {
      if (!messages || messages.length === 0) {
        messagesList.innerHTML = '';
        messageCountEl.textContent = '';
        return;
      }

      messageCountEl.textContent = `${messages.length}`;
      messagesList.innerHTML = messages.map(msg => {
        const instruction = msg.payload?.instruction || JSON.stringify(msg.payload).slice(0, 80);
        return `
          <div class="message-row">
            <div class="message-route">
              <span>${msg.from_agent}</span>
              <span class="message-arrow">→</span>
              <span>${msg.to_agent}</span>
            </div>
            <div class="message-instruction" title="${instruction}">${instruction}</div>
            <span class="message-status status-${msg.status}">${msg.status}</span>
            <span class="message-time">${relativeTime(msg.created_at)}</span>
          </div>`;
      }).join('');
    }

    // ── Fetch data ─────────────────────────────────────
    async function fetchAgents() {
      try {
        const res = await fetch(`${DAEMON_URL}/agents`);
        agents = await res.json();
        renderAgents();
      } catch (e) {
        // daemon unreachable
      }
    }

    async function fetchHealth() {
      try {
        const res = await fetch(`${DAEMON_URL}/health`);
        const data = await res.json();
        statusDot.classList.remove('disconnected');
        statusText.textContent = 'connected';
        uptimeEl.textContent = formatUptime(data.uptime);
        agentCountEl.textContent = `${data.agents} agent${data.agents !== 1 ? 's' : ''}`;
      } catch (e) {
        statusDot.classList.add('disconnected');
        statusText.textContent = 'disconnected';
        uptimeEl.textContent = '—';
        agentCountEl.textContent = '—';
      }
    }

    async function fetchMessages() {
      try {
        const res = await fetch(`${DAEMON_URL}/messages/recent?limit=20`);
        const messages = await res.json();
        renderMessages(messages);
      } catch (e) {
        // silent
      }
    }

    // ── SSE connection ─────────────────────────────────
    function connectSSE() {
      eventSource = new EventSource(`${DAEMON_URL}/events?agent=viewscreen`);

      eventSource.onopen = () => {
        log('viewscreen connected to the-bridge', 'system');
      };

      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'connected') {
          // initial connection
          return;
        }

        if (data.type === 'agent_joined') {
          log(`${data.agent.name} arrived on the bridge`, 'join');
          fetchAgents();
          fetchHealth();
        }

        if (data.type === 'agent_departed') {
          log(`agent departed: ${data.agentId}`, 'depart');
          // Animate departure
          const card = document.querySelector(`[data-id="${data.agentId}"]`);
          if (card) {
            card.classList.add('departing');
            setTimeout(() => { fetchAgents(); fetchHealth(); }, 400);
          } else {
            fetchAgents();
            fetchHealth();
          }
        }

        if (data.type === 'message') {
          log(`${data.from} → message for ${data.messageType}`, 'message');
          fetchMessages();
        }
      };

      eventSource.onerror = () => {
        statusDot.classList.add('disconnected');
        statusText.textContent = 'reconnecting...';
        log('connection lost — reconnecting', 'system');
      };
    }

    // ── Init ───────────────────────────────────────────
    async function init() {
      await fetchHealth();
      await fetchAgents();
      await fetchMessages();
      connectSSE();
      log('viewscreen online', 'system');

      // Periodic refresh (relative times, health)
      setInterval(() => {
        fetchHealth();
        renderAgents(); // re-render for updated relative times
      }, 5000);

      // Periodic message check
      setInterval(fetchMessages, 10000);
    }

    init();
  </script>
</body>
</html>
